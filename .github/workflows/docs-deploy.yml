name: Docs Deploy

on:
  workflow_dispatch:
    inputs:
      version_ref:
        description: 'Bakin release tag, commit SHA, or branch this docs deploy represents'
        required: true
        type: string
      reason:
        description: 'Reason for manual docs deploy'
        required: false
        type: string

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy docs
    runs-on: ubuntu-latest
    env:
      DOCS_DEPLOY_BRANCH: ${{ vars.CLOUDFLARE_DOCS_PRODUCTION_BRANCH || 'main' }}
      PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID || 'GTM-KZQK989V' }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.version_ref || github.ref }}

      # docs:check walks the sibling bakin-bits-official repo for the
      # extracted messaging + projects plugins (see scripts/docs/source-
      # scan.ts). Cloned ABOVE $GITHUB_WORKSPACE so other tooling
      # (e.g. test runners) doesn't accidentally recurse into it.
      # actions/checkout rejects paths outside the workspace, so use
      # plain git clone (the repo is public).
      - name: Clone bakin-bits-official (extracted plugins)
        run: git clone --depth 1 https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/external/bakin-bits-official"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run docs:check

      - name: Upload docs artifact
        uses: actions/upload-artifact@v5
        with:
          name: bakin-docs
          path: docs/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=${{ vars.CLOUDFLARE_DOCS_PROJECT_NAME || 'bakin-docs' }} --branch=${{ env.DOCS_DEPLOY_BRANCH }}
