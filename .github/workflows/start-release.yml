name: Start Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: start-release
  cancel-in-progress: false

jobs:
  tag:
    name: Validate and tag release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate main ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "::error::Run Start Release from main, not ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Validate release input
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Release tag already exists: ${tag}"
            exit 1
          fi
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing ## [${version}]"
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate release notes
        run: bun run scripts/extract-release-notes.ts --version "${{ inputs.version }}" --out "${RUNNER_TEMP}/release-notes.md"

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${tag}"
          git push origin "${tag}"

      - name: Report release workflow
        run: |
          echo "Pushed ${{ steps.release.outputs.tag }}."
          echo "Release workflow: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml?query=branch%3A${{ steps.release.outputs.tag }}"
