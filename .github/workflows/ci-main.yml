name: Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docs:check walks the sibling bakin-bits-official repo for the
      # extracted messaging + projects plugins. Without this, snippet
      # markers like `docs:cli-commands projects` would have no source
      # to render from. See scripts/docs/source-scan.ts.
      #
      # Cloned ABOVE $GITHUB_WORKSPACE so `bun test` doesn't recurse into
      # it and try to run the sibling's plugin tests with bakin's
      # @bakin/sdk path-aliases.
      - name: Checkout bakin-bits-official (extracted plugins)
        uses: actions/checkout@v4
        with:
          repository: markhayden/bakin-bits-official
          path: ../external/bakin-bits-official

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Docs build
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run docs:check

      - name: Tests
        run: bun test --isolate

      - name: Build (host + plugins, no binary compile)
        run: |
          bun run build:css
          bun run build:vendors
          bun run build:plugins
          bun run build:host-shell
