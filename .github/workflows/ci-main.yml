name: Main CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Tests
        run: bun test --isolate

      - name: Build (host + plugins, no binary compile)
        run: |
          bun run build:css
          bun run build:vendors
          bun run build:plugins
          bun run build:host-shell
