name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # docs:check walks the sibling bakin-bits-official repo for the
      # extracted messaging + projects plugins (see scripts/docs/source-
      # scan.ts). Cloned ABOVE $GITHUB_WORKSPACE so `bun test` doesn't
      # recurse into it. actions/checkout rejects paths outside the
      # workspace, so use plain git clone (the repo is public).
      - name: Clone bakin-bits-official (extracted plugins)
        run: git clone --depth 1 https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/external/bakin-bits-official"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Import-cycle ratchet
        run: bun run check:cycles

      - name: Docs build
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run docs:check

      # --timeout 60000: worker contention on the 4-core runner starves
      # render-heavy component tests far past wall-clock expectations — a
      # whole suite run measured 294s here against ~96s locally, and
      # individual tests that take milliseconds locally were observed at
      # 21-60s. 15000 (itself already raised from the 5s default for this
      # reason) still failed them. This bounds genuine hangs, which are
      # unbounded, without failing correct-but-starved tests. See #753.
      # --parallel=2 (NOT bare --parallel): bare --parallel lets bun spawn
      # workers unbounded, which on a 4-vCPU runner starved render-heavy
      # component tests to 21-78s despite taking milliseconds locally, and
      # sometimes wedged a worker so the job stalled silently. package.json's
      # own `bun run test` has always pinned a worker count for this reason.
      # 2 leaves headroom for the OS and GC on a 4-vCPU box. See #753.
      - name: Tests
        run: bun test --parallel=2 --isolate --timeout 60000

  # The release pipeline stamps APP_VERSION before testing, which turns on
  # stamped-host-only behavior (the plugin compat gate skips satisfaction on
  # 0.0.0-dev but enforces on real versions). The rc.21 release build failed
  # on tests that had only ever run unstamped — this job catches that class
  # pre-merge by running the suite against a describe-stamped version.
  check-stamped:
    name: Tests (stamped host)
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history + tags so stamp-version.ts resolves a real
      # describe-stamped version (v0.0.1-rc.N-M-g<sha>) instead of 0.0.0-dev.
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp release version
        run: bun run scripts/stamp-version.ts

      - name: Tests
        run: bun test --parallel=2 --isolate --timeout 60000
