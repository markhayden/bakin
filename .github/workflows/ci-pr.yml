name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # docs:check walks the sibling bakin-bits-official repo for the
      # extracted messaging + projects plugins. Without this, snippet
      # markers like `docs:cli-commands projects` would have no source
      # to render from. See scripts/docs/source-scan.ts.
      - name: Checkout bakin-bits-official (extracted plugins)
        uses: actions/checkout@v4
        with:
          repository: markhayden/bakin-bits-official
          path: external/bakin-bits-official

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Docs build
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ github.workspace }}/external/bakin-bits-official/plugins
        run: bun run docs:check

      - name: Tests
        run: bun test --isolate tests
