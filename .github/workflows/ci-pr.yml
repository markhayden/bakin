name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # docs:check walks the sibling bakin-bits-official repo for the
      # extracted messaging + projects plugins (see scripts/docs/source-
      # scan.ts). Cloned ABOVE $GITHUB_WORKSPACE so `bun test` doesn't
      # recurse into it. actions/checkout rejects paths outside the
      # workspace, so use plain git clone (the repo is public).
      - name: Clone bakin-bits-official (extracted plugins)
        run: git clone --depth 1 https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/external/bakin-bits-official"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Import-cycle ratchet
        run: bun run check:cycles

      - name: Docs build
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run docs:check

  # Tests are SHARDED across runners, and the static checks above no longer
  # run alongside them. This suite (842 files, ~8.5k tests) exceeds what a
  # single 4-vCPU runner absorbs: unsharded, contention starved tests that
  # cost milliseconds locally out to 21-78s, and periodically wedged a worker
  # so a job stalled silently with zero failures logged. Some tests are
  # genuinely heavy — build-sdk-package spawns real builds and costs 8.4s even
  # on a fast local box — so the fix is capacity, not ever-longer timeouts.
  # Each shard gets a whole runner for a third of the files. Bisect record and
  # the ruled-out hypotheses: issue #753.
  #
  # --timeout 60000 still bounds genuine hangs (which are unbounded) without
  # failing correct-but-slow tests on a loaded runner.
  test:
    name: Tests
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Tests (shard ${{ matrix.shard }}/3)
        run: bun test --parallel=4 --isolate --timeout 60000 --shard=${{ matrix.shard }}/3

  # The release pipeline stamps APP_VERSION before testing, which turns on
  # stamped-host-only behavior (the plugin compat gate skips satisfaction on
  # 0.0.0-dev but enforces on real versions). The rc.21 release build failed
  # on tests that had only ever run unstamped — this job catches that class
  # pre-merge by running the suite against a describe-stamped version.
  check-stamped:
    name: Tests (stamped host)
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Full history + tags so stamp-version.ts resolves a real
      # describe-stamped version (v0.0.1-rc.N-M-g<sha>) instead of 0.0.0-dev.
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp release version
        run: bun run scripts/stamp-version.ts

      - name: Tests (shard ${{ matrix.shard }}/3)
        run: bun test --parallel=4 --isolate --timeout 60000 --shard=${{ matrix.shard }}/3
