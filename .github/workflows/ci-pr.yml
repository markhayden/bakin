name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: UI impact
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_ui: ${{ steps.ui.outputs.run_ui }}
      reason: ${{ steps.ui.outputs.reason }}
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify browser UI impact
        id: ui
        env:
          BAKIN_UI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BAKIN_UI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ui/ci-impact.mjs

  visual:
    name: UI visuals
    needs: impact
    if: ${{ github.event.pull_request.draft == false && needs.impact.outputs.run_ui == 'true' }}
    uses: ./.github/workflows/ui-visual.yml
    permissions:
      contents: read

  check:
    name: Checks
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Docs and official UI architecture checks share this Bits source root.
      # Cloned ABOVE $GITHUB_WORKSPACE so `bun test` doesn't
      # recurse into it. actions/checkout rejects paths outside the
      # workspace, so use plain git clone (the repo is public).
      - name: Clone bakin-bits-official (extracted plugins)
        run: |
          BITS_REF="$(node -p "require('./design-system/compatibility.json').repositories['bakin-bits-official'].ref")"
          git clone --filter=blob:none --no-checkout https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/bakin-bits-official"
          git -C "${{ runner.workspace }}/bakin-bits-official" fetch --depth 1 origin "$BITS_REF"
          git -C "${{ runner.workspace }}/bakin-bits-official" checkout --detach FETCH_HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install official Bits dependencies
        working-directory: ${{ runner.workspace }}/bakin-bits-official
        run: bun install --frozen-lockfile

      - name: UI design-system governance
        run: bun run ui:governance:check

      - name: Official UI census
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/bakin-bits-official/plugins
        run: bun run ui:census:check

      - name: Legacy UI style ratchet
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/bakin-bits-official/plugins
        run: bun run ui:legacy-styles:check

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Import-cycle ratchet
        run: bun run check:cycles

      - name: Docs build
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/bakin-bits-official/plugins
        run: bun run docs:check

      - name: Build production browser assets
        run: |
          bun run build:css
          bun run build:vendors
          bun run build:plugins
          bun run build:host-shell

      - name: Browser UI performance ratchet
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/bakin-bits-official/plugins
        run: bun run ui:performance

  # Tests are SHARDED across runners, and the static checks above no longer
  # run alongside them. This suite (842 files, ~8.5k tests) exceeds what a
  # single 4-vCPU runner absorbs: unsharded, contention starved tests that
  # cost milliseconds locally out to 21-78s, and periodically wedged a worker
  # so a job stalled silently with zero failures logged. Some tests are
  # genuinely heavy — build-sdk-package spawns real builds and costs 8.4s even
  # on a fast local box — so the fix is capacity, not ever-longer timeouts.
  # Each shard gets a whole runner for a third of the files. Bisect record and
  # the ruled-out hypotheses: issue #753.
  #
  # --timeout 60000 still bounds genuine hangs (which are unbounded) without
  # failing correct-but-slow tests on a loaded runner.
  test:
    name: Tests
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The stylesheet build scans the SIBLING bakin-bits-official checkout
      # (@source in globals.css), and buildSdkPackage asserts the compiled
      # candidate matches the committed canonical artifact — so every job
      # that compiles CSS needs Bits at the sibling path, pinned by
      # design-system/compatibility.json. Cloned ABOVE $GITHUB_WORKSPACE so
      # `bun test` doesn't recurse into it.
      - name: Clone bakin-bits-official (stylesheet sources)
        run: |
          BITS_REF="$(node -p "require('./design-system/compatibility.json').repositories['bakin-bits-official'].ref")"
          git clone --filter=blob:none --no-checkout https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/bakin-bits-official"
          git -C "${{ runner.workspace }}/bakin-bits-official" fetch --depth 1 origin "$BITS_REF"
          git -C "${{ runner.workspace }}/bakin-bits-official" checkout --detach FETCH_HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Both artifacts are needed by the completeness job: junit carries the
      # file attribute for everything that ran, but a file whose tests are ALL
      # skipped emits no <testsuite> at all — only stdout names it. pipefail so
      # tee cannot mask a failing suite.
      - name: Tests (shard ${{ matrix.shard }}/3)
        shell: bash
        run: |
          set -o pipefail
          bun run test:ci --shard=${{ matrix.shard }}/3 \
            --reporter=junit --reporter-outfile=junit-${{ matrix.shard }}.xml \
            2>&1 | tee shard-${{ matrix.shard }}.log

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ matrix.shard }}
          path: |
            junit-${{ matrix.shard }}.xml
            shard-${{ matrix.shard }}.log
          retention-days: 3

  # The release pipeline stamps APP_VERSION before testing, which turns on
  # stamped-host-only behavior (the plugin compat gate skips satisfaction on
  # 0.0.0-dev but enforces on real versions). The rc.21 release build failed
  # on tests that had only ever run unstamped — this job catches that class
  # pre-merge by running the suite against a describe-stamped version.
  check-stamped:
    name: Tests (stamped host)
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      # Full history + tags so stamp-version.ts resolves a real
      # describe-stamped version (v0.0.1-rc.N-M-g<sha>) instead of 0.0.0-dev.
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp release version
        run: bun run scripts/stamp-version.ts

      # Both artifacts are needed by the completeness job: junit carries the
      # file attribute for everything that ran, but a file whose tests are ALL
      # skipped emits no <testsuite> at all — only stdout names it. pipefail so
      # tee cannot mask a failing suite.
      - name: Tests (shard ${{ matrix.shard }}/3)
        shell: bash
        run: |
          set -o pipefail
          bun run test:ci --shard=${{ matrix.shard }}/3 \
            --reporter=junit --reporter-outfile=junit-${{ matrix.shard }}.xml \
            2>&1 | tee shard-${{ matrix.shard }}.log

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ matrix.shard }}
          path: |
            junit-${{ matrix.shard }}.xml
            shard-${{ matrix.shard }}.log
          retention-days: 3

  # A wedged worker reports GREEN: its chunk never runs, so nothing fails and the
  # exit code is 0. #753 saw ~7 contiguous files silently undispatched. Outcome
  # cannot detect that; coverage can. Every discovered test file must appear in
  # some shard's report.
  completeness:
    name: Test completeness
    needs: [test]
    if: always() && needs.test.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The stylesheet build scans the SIBLING bakin-bits-official checkout
      # (@source in globals.css), and buildSdkPackage asserts the compiled
      # candidate matches the committed canonical artifact — so every job
      # that compiles CSS needs Bits at the sibling path, pinned by
      # design-system/compatibility.json. Cloned ABOVE $GITHUB_WORKSPACE so
      # `bun test` doesn't recurse into it.
      - name: Clone bakin-bits-official (stylesheet sources)
        run: |
          BITS_REF="$(node -p "require('./design-system/compatibility.json').repositories['bakin-bits-official'].ref")"
          git clone --filter=blob:none --no-checkout https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/bakin-bits-official"
          git -C "${{ runner.workspace }}/bakin-bits-official" fetch --depth 1 origin "$BITS_REF"
          git -C "${{ runner.workspace }}/bakin-bits-official" checkout --detach FETCH_HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: junit-test-*
          merge-multiple: true

      - name: Every discovered test file ran
        run: |
          bun scripts/check-test-completeness.ts \
            junit-1.xml junit-2.xml junit-3.xml \
            shard-1.log shard-2.log shard-3.log
