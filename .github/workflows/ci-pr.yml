name: PR CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: UI visuals
    if: ${{ github.event.pull_request.draft == false }}
    uses: ./.github/workflows/ui-visual.yml
    permissions:
      contents: read

  check:
    name: Checks
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Docs and official UI architecture checks share this Bits source root.
      # Cloned ABOVE $GITHUB_WORKSPACE so `bun test` doesn't
      # recurse into it. actions/checkout rejects paths outside the
      # workspace, so use plain git clone (the repo is public).
      - name: Clone bakin-bits-official (extracted plugins)
        run: |
          BITS_REF="$(node -p "require('./design-system/compatibility.json').repositories['bakin-bits-official'].ref")"
          git clone --filter=blob:none --no-checkout https://github.com/markhayden/bakin-bits-official.git "${{ runner.workspace }}/external/bakin-bits-official"
          git -C "${{ runner.workspace }}/external/bakin-bits-official" fetch --depth 1 origin "$BITS_REF"
          git -C "${{ runner.workspace }}/external/bakin-bits-official" checkout --detach FETCH_HEAD

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install official Bits dependencies
        working-directory: ${{ runner.workspace }}/external/bakin-bits-official
        run: bun install --frozen-lockfile

      - name: Official UI census
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run ui:census:check

      - name: Legacy UI style ratchet
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run ui:legacy-styles:check

      - name: Check for ~/.bakin and ~/.openclaw bypasses
        run: bun run lint:home-bypasses

      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Import-cycle ratchet
        run: bun run check:cycles

      - name: Docs build
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run docs:check

      - name: Build production browser assets
        run: |
          bun run build:css
          bun run build:vendors
          bun run build:plugins
          bun run build:host-shell

      - name: Browser UI performance ratchet
        env:
          BAKIN_DOCS_EXTERNAL_SOURCES: ${{ runner.workspace }}/external/bakin-bits-official/plugins
        run: bun run ui:performance

      # --timeout 15000: worker contention on the 4-core runner can push
      # render-heavy component tests past the 5s default (observed 5.4-7.2s).
      - name: Tests
        run: bun test --parallel --isolate --timeout 15000 --path-ignore-patterns "tests/components/kanban-dnd.test.tsx"
      # Quarantined serial step — kanban-dnd destabilizes the parallel pool under
      # contention on 2-vCPU runners (issue #650). Still GATES; quarantine != skip.
      - name: Quarantined serial tests (issue #650)
        run: bun test tests/components/kanban-dnd.test.tsx --isolate --timeout 15000
