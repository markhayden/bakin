# OpenClaw containerized dev environment for Bakin.
# Usage:
#   docker compose up -d openclaw-gateway   # Start gateway
#   docker compose down                     # Stop everything
#
# CLI commands via the shim:
#   ./dev/docker/openclaw-shim.sh cron list --all --json

services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_IMAGE_TAG:-latest}
    container_name: bakin-openclaw-gateway
    ports:
      - "127.0.0.1:18789:18789"
    volumes:
      - ../openclaw-home:/home/node/.openclaw
    # The `instance` rig configures the gateway entirely through openclaw.json
    # (auth token, model, mcp). No env_file: a stale OPENCLAW_GATEWAY_TOKEN there
    # would override gateway.auth.token and break the loopback CLI.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  openclaw-cli:
    image: ghcr.io/openclaw/openclaw:${OPENCLAW_IMAGE_TAG:-latest}
    network_mode: "service:openclaw-gateway"
    volumes:
      - ../openclaw-home:/home/node/.openclaw
    entrypoint: ["node", "dist/index.js"]
    profiles: ["cli"]

  # Full-sandbox: OpenClaw gateway + bun in one container, Bakin repo mounted at
  # /bakin and run via `docker exec` (instance shell / run / --preconfigure).
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
      args:
        OPENCLAW_IMAGE_TAG: ${OPENCLAW_IMAGE_TAG:-latest}
    container_name: bakin-openclaw-sandbox
    ports:
      - "127.0.0.1:3737:3737"    # Bakin UI
      - "127.0.0.1:18789:18789"  # OpenClaw gateway
      - "127.0.0.1:1455:1455"    # codex OAuth callback
    volumes:
      - ../openclaw-home:/home/node/.openclaw
      - ../..:/bakin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18789/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    profiles: ["sandbox"]
