<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>home UI conformance</title>
  <style>
    body { margin: 0 auto; max-width: 72rem; padding: 2rem; color: CanvasText; background: Canvas; font-family: system-ui, sans-serif; line-height: 1.5; }
    main { display: grid; gap: 1.5rem; }
    section { padding-block: 1rem; border-top: 1px solid currentColor; }
    code, strong { font-weight: 700; }
    li { margin-block: 1rem; }
    li p { margin-block: .25rem; }
    .screenshots { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
    figure { margin: 0; }
    img { display: block; width: 100%; max-height: 36rem; object-fit: contain; object-position: top; border: 1px solid currentColor; }
    figcaption { margin-block-start: .5rem; }
  </style>
</head>
<body>
  <main>
    <header><p>Plugin UI conformance</p><h1>home</h1><p>Status: <strong>passed</strong></p></header>
    <section><h2>Package/install blockers</h2><p>None.</p></section>
    <section><h2>Conformance-only findings</h2><p>None.</p></section>
    <section><h2>Screenshot evidence</h2><div class="screenshots"><figure><a href="screenshots/primary-desktop.png"><img src="screenshots/primary-desktop.png" alt="primary desktop fixture screenshot"></a><figcaption>primary / desktop</figcaption></figure><figure><a href="screenshots/primary-mobile.png"><img src="screenshots/primary-mobile.png" alt="primary mobile fixture screenshot"></a><figcaption>primary / mobile</figcaption></figure></div></section>
  </main>

</html>
