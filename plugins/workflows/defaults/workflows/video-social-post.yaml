id: video-social-post
name: Video Social Post
description: Write copy, script and assemble video via nested workflows, review, and publish
version: 1

steps:
  - id: write-copy
    type: agent
    label: Write Copy
    agent: $assigned
    description: >
      Write the post caption and a creative brief for the video.
      Output must include: caption, video concept, target length,
      and any reference material or mood direction.

  - id: copy-gate
    type: gate
    label: Approve Copy
    description: Owner reviews copy and video brief before production begins
    approval_required: true
    on_reject:
      goto: write-copy
      note_to_agent: true

  - id: script-video
    type: workflow
    label: Script Video
    workflow_id: video-script
    description: Nested video scripting workflow — write script, approve, break into clip segments

  - id: assemble-video
    type: workflow
    label: Assemble Video
    workflow_id: assemble-video
    description: Nested video assembly workflow — voiceover, stitching, and final approval

  - id: publish
    type: output
    label: Publish
    agent: $assigned
    description: >
      Post the caption and final video using bakin_exec_post_channel.

      From stepOutputs, extract the caption from the write-copy step and the
      videoAssetId from the assemble-video step (steps run in their own
      working directories — file paths never cross steps, asset ids do).

      Call bakin_exec_post_channel with:
        - channel: the appropriate runtime channel
        - content: the caption text
        - videoAssetId: the assetId from the assemble-video step output
        - taskId: your task ID

      After posting, submit output with the returned messageId and channel.
    channels:
      - general
