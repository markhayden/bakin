id: assemble-video
name: Assemble Video
description: Generate voiceover, stitch approved clips, and publish the final video
version: 1

steps:
  - id: generate-voiceover
    type: agent
    label: Generate Voiceover
    agent: $assigned
    description: >
      Generate voiceover audio from the approved script via TTS. Save the
      audio file as a managed asset (bakin_exec_assets_save, type: 'audio')
      and submit the returned assetId as voiceoverAssetId in your output —
      later steps run in their OWN working directories, so raw file paths do
      not survive across steps; asset ids do.

  - id: voiceover-gate
    type: gate
    label: Approve Voiceover
    description: Owner reviews the voiceover audio
    approval_required: true
    on_reject:
      goto: generate-voiceover
      note_to_agent: true

  - id: stitch-video
    type: agent
    label: Stitch Video
    agent: $assigned
    description: >
      Concatenate clips, overlay voiceover and music via ffmpeg. Fetch input
      clips and the voiceover by their assetIds from prior step outputs
      (download via /api/assets/<assetId> or bakin_exec_get_paths) — never
      expect prior steps' raw file paths to exist. Save the assembled video
      as a managed asset (bakin_exec_assets_save, type: 'video') and submit
      the returned assetId as videoAssetId in your output.

  - id: final-gate
    type: gate
    label: Approve Final Video
    description: Owner reviews the assembled video before publishing
    approval_required: true
    on_reject:
      goto: stitch-video
      note_to_agent: true

  - id: publish
    type: output
    label: Publish
    channels:
      - general
    agent: $assigned
    description: Post the final video to the channel
