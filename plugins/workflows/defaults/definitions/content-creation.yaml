id: content-creation
name: Content Post with Assets
description: Full pipeline — copy, image, video, review gate, then publish
version: 1

steps:
  - id: write-copy
    type: agent
    label: Write Copy
    agent: chef
    skill: write-copy

  - id: create-assets
    type: parallel
    label: Generate Assets
    steps:
      - id: create-image
        type: agent
        label: Generate Image
        agent: pixel
        skill: generate-image

      - id: create-video
        type: agent
        label: Generate Video
        agent: rolo
        skill: generate-video

  - id: review-gate
    type: gate
    label: Mark Reviews
    description: Review all assets before publishing
    approval_required: true
    on_approve: publish
    on_reject:
      goto: write-copy
      note_to_agent: true

  - id: publish
    type: output
    label: Publish
    channels:
      - discord
    agent: main-operator
    skill: publish
