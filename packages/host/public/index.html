<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bakin</title>
    <link rel="icon" href="/bakin-logo.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/globals.css" />
    <style>
      :root { color-scheme: dark; }
      html, body, #root { min-height: 100%; }
      body {
        margin: 0;
        background: #0f0e0e;
        color: #ffffff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .bakin-boot {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0e0e;
      }
      .bakin-boot__inner {
        display: flex;
        align-items: center;
        gap: 14px;
        color: #aeaaaa;
        font-size: 13px;
      }
      .bakin-boot__spinner {
        width: 30px;
        height: 30px;
        border: 3px solid rgba(255, 77, 148, 0.18);
        border-top-color: #ff4d94;
        border-radius: 9999px;
        animation: bakin-spin 800ms linear infinite;
      }
      .bakin-boot__text {
        display: block;
        line-height: 1;
      }
      @keyframes bakin-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <!--
      Import map (TD3 of #147) — resolves the externals the shell + plugins
      share at runtime. Keep ordering consistent with the externals list in
      packages/host/build.ts and scripts/build-vendors.ts.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "/vendor/react.js",
          "react-dom": "/vendor/react-dom.js",
          "react-dom/client": "/vendor/react-dom.js",
          "react/jsx-runtime": "/vendor/jsx-runtime.js",
          "react/jsx-dev-runtime": "/vendor/jsx-dev-runtime.js",
          "@tanstack/react-router": "/vendor/tanstack-router.js",
          "@makinbakin/sdk": "/vendor/sdk-index.js",
          "@makinbakin/sdk/ui": "/vendor/sdk-ui.js",
          "@makinbakin/sdk/layout": "/vendor/sdk-layout.js",
          "@makinbakin/sdk/patterns": "/vendor/sdk-patterns.js",
          "@makinbakin/sdk/charts": "/vendor/sdk-charts.js",
          "@makinbakin/sdk/conversation": "/vendor/sdk-conversation.js",
          "@makinbakin/sdk/hooks": "/vendor/sdk-hooks.js",
          "@makinbakin/sdk/components": "/vendor/sdk-components.js",
          "@makinbakin/sdk/slots": "/vendor/sdk-slots.js",
          "@makinbakin/sdk/types": "/vendor/sdk-types.js",
          "@makinbakin/sdk/utils": "/vendor/sdk-utils.js",
          "@makinbakin/sdk/metadata": "/vendor/sdk-metadata.js",
          "@makinbakin/sdk/routing": "/vendor/sdk-routing.js",
          "@makinbakin/sdk/internal": "/vendor/sdk-internal.js"
        }
      }
    </script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root">
      <div class="bakin-boot" role="status" aria-live="polite">
        <div class="bakin-boot__inner">
          <span class="bakin-boot__spinner" aria-hidden="true"></span>
          <span class="bakin-boot__text">Loading app</span>
        </div>
      </div>
    </div>
    <script type="module" src="/_app/main.js"></script>
  </body>
</html>
