[test]
preload = ["./tests/setup.ts"]

# NOTE: there is deliberately no [test.env] section. bun does not read one (probed on 1.3.13, 1.4.2 and 1.4.3) —
# probed directly: a var set there arrives `undefined` in the test process, while
# NODE_ENV appears only because `bun test` sets it itself. The section this file used
# to carry was decorative. Test-run env belongs in the preload (tests/setup.ts), which
# actually executes.
